name: Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check rule core
        run: dotnet run --project windows/PriceReminder.CoreChecks/PriceReminder.CoreChecks.csproj --configuration Release
      - name: Build Windows app
        run: dotnet build windows/PriceReminder.Windows.csproj --configuration Release
      - name: Publish self-contained app
        run: dotnet publish windows/PriceReminder.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/PriceReminder-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PriceReminder-Windows-x64
          path: dist/PriceReminder-Windows-x64.zip
          if-no-files-found: error
